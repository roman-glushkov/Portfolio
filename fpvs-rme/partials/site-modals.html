<!-- МОДАЛКА-ПОСТ -->
<div class="post-modal" id="postModal" aria-hidden="true">
  <div class="post-modal__backdrop" data-post-close></div>
  <article class="post-modal__card">
    <button class="post-modal__close" data-post-close aria-label="Закрыть">
      ✕
    </button>
    <header class="post-modal__head">
      <label class="post-modal__tag" id="pmTag"></label>
      <h2 class="post-modal__title" id="pmTitle"></h2>
      <span class="post-modal__date" id="pmDate"></span>
    </header>
    <div class="post-modal__body" id="pmBody"></div>
    <div class="post-modal__gallery" id="pmGallery"></div>
  </article>
</div>

<div class="album-modal" id="albumModal" aria-hidden="true">
  <div class="album-modal__backdrop" data-album-close></div>
  <article class="album-modal__card">
    <button class="album-modal__close" data-album-close aria-label="Закрыть">
      ✕
    </button>
    <header class="album-modal__head">
      <h2 class="album-modal__title" id="amTitle"></h2>
      <span class="album-modal__meta" id="amMeta"></span>
    </header>
    <div class="album-modal__grid" id="amGrid"></div>
  </article>
</div>

<!-- ЛАЙТБОКС -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" aria-label="Закрыть">✕</button>
  <button class="lb-prev" aria-label="Назад">‹</button>
  <img class="lb-img" src="" alt="" />
  <button class="lb-next" aria-label="Вперёд">›</button>
  <span class="lb-counter"></span>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- МОДАЛКА "ВСЕ ТУРНИРЫ" -->
<div class="all-tournaments-modal" id="allTournamentsModal" aria-hidden="true">
  <div class="all-tournaments-modal__backdrop" data-all-close></div>
  <article class="all-tournaments-modal__card">
    <button
      class="all-tournaments-modal__close"
      data-all-close
      aria-label="Закрыть"
    >
      ✕
    </button>
    <header class="all-tournaments-modal__head">
      <small>ВСЕ СОРЕВНОВАНИЯ</small>
      <h2>Турниры федерации</h2>
    </header>
    <div class="all-tournaments-modal__list" id="atList"></div>
  </article>
</div>

<!-- МОДАЛКА "ВСЕ СОБЫТИЯ" -->
<div class="all-events-modal" id="allEventsModal" aria-hidden="true">
  <div class="all-events-modal__backdrop" data-all-events-close></div>
  <article class="all-events-modal__card">
    <button
      class="all-events-modal__close"
      data-all-events-close
      aria-label="Закрыть"
    >
      ✕
    </button>
    <header class="all-events-modal__head">
      <small>ПОЛНЫЙ КАЛЕНДАРЬ</small>
      <h2>Все события</h2>
      <div
        class="calendar-filters calendar-filters--modal"
        id="calendarFiltersModal"
      >
        <button class="cal-filter active" data-sport="">Все</button>
        <button class="cal-filter" data-sport="football">⚽ Футбол</button>
        <button class="cal-filter" data-sport="volleyball">🏐 Волейбол</button>
      </div>
    </header>
    <div class="all-events-modal__list" id="allEventsList"></div>
  </article>
</div>

<!-- МОДАЛКА "ВСЕ ФОТОГРАФИИ" -->
<div class="all-photos-modal" id="allPhotosModal" aria-hidden="true">
  <div class="all-photos-modal__backdrop" data-all-photos-close></div>
  <article class="all-photos-modal__card">
    <button
      class="all-photos-modal__close"
      data-all-photos-close
      aria-label="Закрыть"
    >
      ✕
    </button>
    <header class="all-photos-modal__head">
      <small>ПОЛНАЯ ЛЕНТА</small>
      <h2>Все фотографии</h2>
    </header>
    <div class="all-photos-modal__list" id="allPhotosList"></div>
  </article>
</div>

<!-- ========== МОДАЛКА "ВСЕ НОВОСТИ" ========== -->
<div class="all-news-modal" id="allNewsModal" aria-hidden="true">
  <div class="all-news-modal__backdrop" data-all-news-close></div>
  <article class="all-news-modal__card">
    <button
      class="all-news-modal__close"
      data-all-news-close
      aria-label="Закрыть"
    >
      ✕
    </button>
    <header class="all-news-modal__head">
      <small>ПОЛНЫЙ АРХИВ</small>
      <h2>Все новости</h2>
    </header>
    <div class="all-news-modal__list" id="allNewsList">
      <div class="loading">Загрузка...</div>
    </div>
  </article>
</div>
